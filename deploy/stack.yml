# EuphratesWeb — Docker Swarm stack
# ---------------------------------------------------------------------------
# One overlay network, one ingress (Traefik), and each app as a service.
# Deploy:  docker stack deploy -c deploy/stack.yml euphrates
# Add a new app later: copy the "ai-teacher" service block, change the image,
# host rule, and volumes. That's the whole "add an app to the swarm" workflow.
# ---------------------------------------------------------------------------
version: "3.8"

x-common-deploy: &common-deploy
  restart_policy:
    condition: any
    delay: 5s
  update_config:
    order: start-first      # start the new task before stopping the old one
    parallelism: 1
    delay: 10s
    failure_action: rollback
  rollback_config:
    order: stop-first

services:
  # --- Ingress / reverse proxy ---------------------------------------------
  traefik:
    image: traefik:v3.3
    command:
      - "--providers.swarm=true"
      - "--providers.swarm.exposedByDefault=false"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.network=euphrates_edge"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect all HTTP to HTTPS at the edge
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Automatic TLS via Let's Encrypt. Set ACME_EMAIL in your shell.
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@euphratesweb.com}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      # - "--api.dashboard=true"   # enable + protect before exposing publicly
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_letsencrypt:/letsencrypt"
    networks:
      - edge
    deploy:
      <<: *common-deploy
      placement:
        constraints:
          - node.role == manager   # Traefik needs the manager's docker socket

  # --- Euphrates Voice demo (the existing AI Teacher, C#) -------------------
  ai-teacher:
    image: ${REGISTRY:-localhost}/euphrates/ai-teacher:${TAG:-latest}
    environment:
      Ai__Provider: "${AI_PROVIDER:-Stub}"
      Ai__TtsProvider: "${AI_TTS_PROVIDER:-OpenAI}"
      # API keys are NOT set here — they come from Docker secrets below.
    secrets:
      - source: openai_api_key
        target: Ai__OpenAi__ApiKey
      - source: elevenlabs_api_key
        target: Ai__ElevenLabs__ApiKey
    volumes:
      - "aiteacher_data:/app/App_Data"
      - "aiteacher_generated:/app/wwwroot/generated"
    networks:
      - edge
    deploy:
      <<: *common-deploy
      replicas: 1              # keep at 1 while storage is local-file based
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=euphrates_edge"
        - "traefik.http.routers.ai-teacher.rule=Host(`${AI_TEACHER_HOST:-ai.localhost}`)"
        - "traefik.http.routers.ai-teacher.entrypoints=websecure"
        - "traefik.http.routers.ai-teacher.tls.certresolver=le"
        - "traefik.http.services.ai-teacher.loadbalancer.server.port=8080"
        - "traefik.http.services.ai-teacher.loadbalancer.healthcheck.path=/healthz"
        - "traefik.http.services.ai-teacher.loadbalancer.healthcheck.interval=15s"

networks:
  edge:
    driver: overlay
    attachable: true

volumes:
  traefik_letsencrypt:
  aiteacher_data:
  aiteacher_generated:

secrets:
  # Create these once on the swarm before deploying (see deploy/DEPLOY.md):
  #   printf '%s' "$OPENAI_KEY"     | docker secret create openai_api_key -
  #   printf '%s' "$ELEVENLABS_KEY" | docker secret create elevenlabs_api_key -
  openai_api_key:
    external: true
  elevenlabs_api_key:
    external: true
